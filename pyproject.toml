[project]
name = "org-readme-gen"
version = "0.1.0"
description = "使用 LLM 自动生成和更新 GitHub 组织主页 README"
readme = "README.md"
authors = [
    { name = "DealiAxy", email = "dealiaxy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "openai>=1.82.0",
    "anthropic>=0.52.0",
    "pyyaml>=6.0.2",
    "typer>=0.19.2",
    "rich>=14.1.0",
]

[project.scripts]
org-readme-gen = "org_readme_gen.cli:main"

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/org_readme_gen"]

[dependency-groups]
dev = ["pytest>=8.4.1"]
